<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">Escada de maturidade da Torre de Controle</title><desc id="d">Quatro níveis progressivos: visível, reativa, proativa e adaptativa.</desc>
<rect width="1200" height="440" fill="#f4f4f2"/><g font-family="Arial, sans-serif"><text x="55" y="55" fill="#111" font-size="28" font-weight="700">Escada de maturidade</text><g transform="translate(55 100)">
<g transform="translate(0 180)"><rect width="255" height="145" fill="#292929"/><rect width="255" height="7" fill="#999"/><text x="24" y="48" fill="#fff" font-size="22" font-weight="700">1. VISÍVEL</text><text x="24" y="82" fill="#ddd" font-size="16">Centraliza dados</text><text x="24" y="108" fill="#ddd" font-size="16">e mostra o status.</text></g>
<g transform="translate(270 120)"><rect width="255" height="205" fill="#242424"/><rect width="255" height="7" fill="#d19a00"/><text x="24" y="48" fill="#fff" font-size="22" font-weight="700">2. REATIVA</text><text x="24" y="82" fill="#ddd" font-size="16">Detecta alertas</text><text x="24" y="108" fill="#ddd" font-size="16">e responde ao</text><text x="24" y="134" fill="#ddd" font-size="16">problema ocorrido.</text></g>
<g transform="translate(540 60)"><rect width="255" height="265" fill="#1f1f1f"/><rect width="255" height="7" fill="#ff5a00"/><text x="24" y="48" fill="#fff" font-size="22" font-weight="700">3. PROATIVA</text><text x="24" y="82" fill="#ddd" font-size="16">Prevê riscos, prioriza</text><text x="24" y="108" fill="#ddd" font-size="16">e atua antes que o</text><text x="24" y="134" fill="#ddd" font-size="16">impacto se consolide.</text></g>
<g transform="translate(810 0)"><rect width="280" height="325" fill="#171717"/><rect width="280" height="7" fill="#20825d"/><text x="24" y="48" fill="#fff" font-size="22" font-weight="700">4. ADAPTATIVA</text><text x="24" y="82" fill="#ddd" font-size="16">Aprende com causas</text><text x="24" y="108" fill="#ddd" font-size="16">e resultados para</text><text x="24" y="134" fill="#ddd" font-size="16">redesenhar regras,</text><text x="24" y="160" fill="#ddd" font-size="16">processos e capacidade.</text></g>
<path d="M15 352h1030" stroke="#ff5a00" stroke-width="7"/><path d="m1030 334 36 18-36 18" fill="#ff5a00"/></g></g></svg>
